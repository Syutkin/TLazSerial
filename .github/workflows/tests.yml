name: Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Cache Lazarus toolchain
        id: toolchain-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.tool_cache }}/tlazserial/lazarus-4.8-linux-x64.tar
          key: tlazserial-ubuntu-24.04-x64-lazarus-4.8-fpc-3.2.2-v1

      - name: Restore cached Lazarus toolchain
        if: steps.toolchain-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TOOL_CACHE/tlazserial/lazarus-4.8-linux-x64.tar"
          sudo tar --extract --file "$archive" --directory /

      - name: Install Linux GUI dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes xvfb libgtk2.0-dev

      - name: Install Lazarus 4.8
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          base_url='https://download.lazarus-ide.org/Lazarus%20Linux%20amd64%20DEB/Lazarus%204.8'
          fpc_package="$RUNNER_TEMP/fpc-laz_3.2.2-210709_amd64.deb"
          fpc_sources="$RUNNER_TEMP/fpc-src_3.2.2-210709_amd64.deb"
          lazarus_package="$RUNNER_TEMP/lazarus-project_4.8.0-0_amd64.deb"

          curl --fail --location --retry 3 \
            "$base_url/fpc-laz_3.2.2-210709_amd64.deb" \
            --output "$fpc_package"
          curl --fail --location --retry 3 \
            "$base_url/fpc-src_3.2.2-210709_amd64.deb" \
            --output "$fpc_sources"
          curl --fail --location --retry 3 \
            "$base_url/lazarus-project_4.8.0-0_amd64.deb" \
            --output "$lazarus_package"

          echo "92000f2b831184e153aab0c910f8ae9240450e5c6d76dc189cf53116ee501d83  $fpc_package" | sha256sum --check
          echo "8c9e145d8056754a9ca39ce3e52e982b8e4816124984c5f542f2a874e721ad53  $fpc_sources" | sha256sum --check
          echo "401742cefb01ad99a628188034bf728fb5360d641ed2be5f91fb0ee183a301cd  $lazarus_package" | sha256sum --check

          sudo apt-get install --yes \
            "$fpc_package" \
            "$fpc_sources" \
            "$lazarus_package"

      - name: Snapshot Lazarus toolchain
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TOOL_CACHE/tlazserial/lazarus-4.8-linux-x64.tar"
          lazarus_dir="$(dirname "$(readlink -f "$(command -v lazbuild)")")"
          fpc_dir="$(dirname "$(readlink -f "$(command -v ppcx64)")")"

          case "$lazarus_dir" in
            /usr/lib/lazarus*|/usr/share/lazarus*|/opt/lazarus*) ;;
            *) echo "Unexpected Lazarus directory: $lazarus_dir" >&2; exit 1 ;;
          esac
          case "$fpc_dir" in
            /usr/lib/fpc/*|/usr/lib/*/fpc/*|/usr/share/fpc/*|/opt/fpc/*) ;;
            *) echo "Unexpected FPC directory: $fpc_dir" >&2; exit 1 ;;
          esac

          mkdir -p "$(dirname "$archive")"
          sudo tar --create --file "$archive" --directory / \
            etc/fpc.cfg \
            usr/bin/fpc \
            usr/bin/fpcmake \
            usr/bin/fpcmkcfg \
            usr/bin/fpcres \
            usr/bin/lazbuild \
            usr/bin/ppcx64 \
            "${fpc_dir#/}" \
            "${lazarus_dir#/}"
          sudo chown "$(id -u):$(id -g)" "$archive"

      - name: Configure toolchain paths
        shell: bash
        run: |
          set -euo pipefail
          lazbuild_path="$(readlink -f "$(command -v lazbuild)")"
          lazarus_dir="$(dirname "$lazbuild_path")"
          test -d "$lazarus_dir/lcl"
          echo "LAZARUS_DIR=$lazarus_dir" >> "$GITHUB_ENV"

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(lazbuild --lazarusdir="$LAZARUS_DIR" --version)" = '4.8'
          test "$(fpc -iV)" = '3.2.2'

      - name: Save Lazarus toolchain cache
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.tool_cache }}/tlazserial/lazarus-4.8-linux-x64.tar
          key: tlazserial-ubuntu-24.04-x64-lazarus-4.8-fpc-3.2.2-v1

      - name: Build package, tests and examples
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts

          lazbuild --lazarusdir="$LAZARUS_DIR" \
            --build-all --ws=gtk2 LazSerialPort.lpk \
            2>&1 | tee ci-artifacts/build-package.log
          lazbuild --lazarusdir="$LAZARUS_DIR" --build-all --ws=gtk2 \
            tests/deviceinfo/serialdeviceinfotests.lpi \
            2>&1 | tee ci-artifacts/build-deviceinfo-tests.log
          lazbuild --lazarusdir="$LAZARUS_DIR" --build-all --ws=gtk2 \
            tests/selector/serialselectortests.lpi \
            2>&1 | tee ci-artifacts/build-selector-tests.log
          lazbuild --lazarusdir="$LAZARUS_DIR" --build-all --ws=gtk2 \
            examples/serial-selector/serialselectorexample.lpi \
            2>&1 | tee ci-artifacts/build-serial-selector-example.log
          lazbuild --lazarusdir="$LAZARUS_DIR" --build-all --ws=gtk2 \
            examples/serial-gps/serialgpsexample.lpi \
            2>&1 | tee ci-artifacts/build-serial-gps-example.log

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail

          tests/deviceinfo/.test_build/serialdeviceinfotests \
            --all --format=xml \
            --file=ci-artifacts/deviceinfo-results.xml \
            2>&1 | tee ci-artifacts/run-deviceinfo-tests.log
          xvfb-run --auto-servernum \
            tests/selector/.test_build/serialselectortests \
            --all --format=xml \
            --file=ci-artifacts/selector-results.xml \
            2>&1 | tee ci-artifacts/run-selector-tests.log

      - name: Validate test reports
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          echo '### FPCUnit results' >> "$GITHUB_STEP_SUMMARY"
          echo '| Project | Tests | Errors | Failures |' >> "$GITHUB_STEP_SUMMARY"
          echo '| --- | ---: | ---: | ---: |' >> "$GITHUB_STEP_SUMMARY"

          validate_report() {
            report="$1"
            project="$2"
            test -s "$report"
            tests="$(sed -n 's:.*<NumberOfRunTests>\([0-9][0-9]*\)</NumberOfRunTests>.*:\1:p' "$report" | tail -n 1)"
            errors="$(sed -n 's:.*<NumberOfErrors>\([0-9][0-9]*\)</NumberOfErrors>.*:\1:p' "$report" | tail -n 1)"
            failures="$(sed -n 's:.*<NumberOfFailures>\([0-9][0-9]*\)</NumberOfFailures>.*:\1:p' "$report" | tail -n 1)"
            test -n "$tests"
            test -n "$errors"
            test -n "$failures"
            printf '| %s | %s | %s | %s |\n' \
              "$project" "$tests" "$errors" "$failures" \
              >> "$GITHUB_STEP_SUMMARY"
            test "$tests" -gt 0
            test "$errors" -eq 0
            test "$failures" -eq 0
          }

          validate_report ci-artifacts/deviceinfo-results.xml deviceinfo
          validate_report ci-artifacts/selector-results.xml selector

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tlazserial-linux-test-reports
          path: ci-artifacts/*-results.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: tlazserial-linux-diagnostics
          path: |
            ci-artifacts/
            tests/deviceinfo/.test_build/
            tests/selector/.test_build/
          if-no-files-found: warn
          retention-days: 14

  windows:
    name: Windows 2025
    runs-on: windows-2025
    timeout-minutes: 45

    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Cache Lazarus toolchain
        id: toolchain-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.tool_cache }}/tlazserial/lazarus-4.8-windows-x64.tar
          key: tlazserial-windows-2025-x64-lazarus-4.8-fpc-3.2.2-v1

      - name: Restore cached Lazarus toolchain
        if: steps.toolchain-cache.outputs.cache-hit == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TOOL_CACHE `
            'tlazserial\lazarus-4.8-windows-x64.tar'
          tar.exe -xf $archive -C C:\
          if ($LASTEXITCODE -ne 0) {
            throw "Could not restore Lazarus toolchain: exit code $LASTEXITCODE"
          }

      - name: Install Lazarus 4.8
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path $env:RUNNER_TEMP 'lazarus-4.8-fpc-3.2.2-win64.exe'
          $url = 'https://download.lazarus-ide.org/Lazarus%20Windows%2064%20bits/Lazarus%204.8/lazarus-4.8-fpc-3.2.2-win64.exe'
          curl.exe --fail --location --retry 3 $url --output $installer
          if ($LASTEXITCODE -ne 0) {
            throw "Could not download Lazarus installer: exit code $LASTEXITCODE"
          }

          $actualHash = (Get-FileHash -Algorithm SHA256 $installer).Hash
          $expectedHash = 'ED25EE171D55E23CF14E0633159FDD2325EFBA56E186F8AB817AD3BF97D267D7'
          if ($actualHash -ne $expectedHash) {
            throw "Unexpected Lazarus installer hash: $actualHash"
          }

          $process = Start-Process -FilePath $installer -ArgumentList @(
            '/VERYSILENT',
            '/SUPPRESSMSGBOXES',
            '/NORESTART',
            '/SP-',
            '/DIR=C:\Lazarus'
          ) -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Lazarus installer failed: exit code $($process.ExitCode)"
          }

      - name: Snapshot Lazarus toolchain
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TOOL_CACHE `
            'tlazserial\lazarus-4.8-windows-x64.tar'
          New-Item -ItemType Directory -Force (Split-Path $archive) |
            Out-Null
          tar.exe -cf $archive -C C:\ Lazarus
          if ($LASTEXITCODE -ne 0) {
            throw "Could not snapshot Lazarus toolchain: exit code $LASTEXITCODE"
          }

      - name: Configure toolchain paths
        shell: pwsh
        run: |
          'C:\Lazarus' | Out-File -FilePath $env:GITHUB_PATH -Append
          'C:\Lazarus\fpc\3.2.2\bin\x86_64-win64' |
            Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Verify toolchain
        shell: pwsh
        run: |
          if ((lazbuild --version) -ne '4.8') {
            throw 'Lazarus 4.8 was not installed'
          }
          if ((fpc -iV) -ne '3.2.2') {
            throw 'FPC 3.2.2 was not installed'
          }

      - name: Save Lazarus toolchain cache
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.tool_cache }}/tlazserial/lazarus-4.8-windows-x64.tar
          key: tlazserial-windows-2025-x64-lazarus-4.8-fpc-3.2.2-v1

      - name: Build package, tests and examples
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force ci-artifacts | Out-Null

          function Invoke-LazBuild {
            param(
              [string] $LogFile,
              [string] $Project
            )

            & lazbuild --build-all --ws=win32 $Project *>&1 |
              Tee-Object -FilePath $LogFile
            if ($LASTEXITCODE -ne 0) {
              throw "lazbuild failed for ${Project}: exit code $LASTEXITCODE"
            }
          }

          Invoke-LazBuild 'ci-artifacts/build-package.log' `
            'LazSerialPort.lpk'
          Invoke-LazBuild 'ci-artifacts/build-deviceinfo-tests.log' `
            'tests/deviceinfo/serialdeviceinfotests.lpi'
          Invoke-LazBuild 'ci-artifacts/build-selector-tests.log' `
            'tests/selector/serialselectortests.lpi'
          Invoke-LazBuild 'ci-artifacts/build-serial-selector-example.log' `
            'examples/serial-selector/serialselectorexample.lpi'
          Invoke-LazBuild 'ci-artifacts/build-serial-gps-example.log' `
            'examples/serial-gps/serialgpsexample.lpi'

      - name: Run tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          & .\tests\deviceinfo\.test_build\serialdeviceinfotests.exe `
            --all --format=xml `
            --file=ci-artifacts/deviceinfo-results.xml *>&1 |
            Tee-Object -FilePath ci-artifacts/run-deviceinfo-tests.log
          if ($LASTEXITCODE -ne 0) {
            throw "Device-info tests failed: exit code $LASTEXITCODE"
          }

          & .\tests\selector\.test_build\serialselectortests.exe `
            --all --format=xml `
            --file=ci-artifacts/selector-results.xml *>&1 |
            Tee-Object -FilePath ci-artifacts/run-selector-tests.log
          if ($LASTEXITCODE -ne 0) {
            throw "Selector tests failed: exit code $LASTEXITCODE"
          }

      - name: Validate test reports
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Add-Content $env:GITHUB_STEP_SUMMARY '### FPCUnit results'
          Add-Content $env:GITHUB_STEP_SUMMARY '| Project | Tests | Errors | Failures |'
          Add-Content $env:GITHUB_STEP_SUMMARY '| --- | ---: | ---: | ---: |'

          function Test-FpcUnitReport {
            param(
              [string] $Report,
              [string] $Project
            )

            if (-not (Test-Path -LiteralPath $Report -PathType Leaf)) {
              throw "Missing FPCUnit report: $Report"
            }
            [xml] $Document = Get-Content -LiteralPath $Report -Raw
            [int] $Tests = $Document.TestResults.NumberOfRunTests
            [int] $Errors = $Document.TestResults.NumberOfErrors
            [int] $Failures = $Document.TestResults.NumberOfFailures
            Add-Content $env:GITHUB_STEP_SUMMARY `
              "| $Project | $Tests | $Errors | $Failures |"
            if ($Tests -le 0) {
              throw "FPCUnit report contains no executed tests: $Report"
            }
            if (($Errors -ne 0) -or ($Failures -ne 0)) {
              throw "FPCUnit report contains errors or failures: $Report"
            }
          }

          Test-FpcUnitReport 'ci-artifacts/deviceinfo-results.xml' 'deviceinfo'
          Test-FpcUnitReport 'ci-artifacts/selector-results.xml' 'selector'

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tlazserial-windows-test-reports
          path: ci-artifacts/*-results.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: tlazserial-windows-diagnostics
          path: |
            ci-artifacts/
            tests/deviceinfo/.test_build/
            tests/selector/.test_build/
          if-no-files-found: warn
          retention-days: 14

  macos:
    name: macOS latest ARM64
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Cache Lazarus toolchain
        id: toolchain-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.tool_cache }}/tlazserial/lazarus-4.8-macos-arm64.tar
          key: tlazserial-macos-latest-arm64-lazarus-4.8-fpc-3.2.4rc1-v2

      - name: Restore cached Lazarus toolchain
        if: steps.toolchain-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TOOL_CACHE/tlazserial/lazarus-4.8-macos-arm64.tar"
          sudo tar --extract --file "$archive" --directory /

      - name: Install Lazarus 4.8
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          base_url='https://download.lazarus-ide.org/Lazarus%20macOS%20aarch64/Lazarus%204.8'
          fpc_image="$RUNNER_TEMP/fpc-3.2.4rc1a.intelarm64-macosx.dmg"
          lazarus_archive="$RUNNER_TEMP/lazarus-darwin-aarch64-4.8.zip"
          fpc_volume="$RUNNER_TEMP/fpc-volume"
          lazarus_dir="$RUNNER_TOOL_CACHE/tlazserial/installed/lazarus-4.8"

          curl --fail --location --retry 3 \
            "$base_url/fpc-3.2.4rc1a.intelarm64-macosx.dmg" \
            --output "$fpc_image"
          curl --fail --location --retry 3 \
            "$base_url/lazarus-darwin-aarch64-4.8.zip" \
            --output "$lazarus_archive"

          echo "e7792c59a31982a00021566d1ab63b0c794ff87d63b6123fe0f45e8f5627f798  $fpc_image" | shasum --algorithm 256 --check
          echo "e5e0bf52bca911d4605dc875bd924ff5c74a0d0f6cf5699b936b377cc1986d1b  $lazarus_archive" | shasum --algorithm 256 --check

          mkdir -p "$fpc_volume" "$lazarus_dir"
          hdiutil attach "$fpc_image" \
            -nobrowse -readonly -mountpoint "$fpc_volume"
          trap 'hdiutil detach "$fpc_volume" || true' EXIT

          package_count=0
          while IFS= read -r -d '' package; do
            sudo installer -pkg "$package" -target /
            package_count=$((package_count + 1))
          done < <(find "$fpc_volume" -name '*.pkg' -print0)
          test "$package_count" -gt 0

          hdiutil detach "$fpc_volume"
          trap - EXIT

          xattr -cr "$lazarus_archive"
          unzip -q "$lazarus_archive" -d "$lazarus_dir"

      - name: Snapshot Lazarus toolchain
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TOOL_CACHE/tlazserial/lazarus-4.8-macos-arm64.tar"
          lazarus_dir="$RUNNER_TOOL_CACHE/tlazserial/installed/lazarus-4.8"
          fpc_config_dir="$RUNNER_TOOL_CACHE/tlazserial/installed/fpc-config"
          mkdir -p "$fpc_config_dir"
          cp -L /etc/fpc.cfg "$fpc_config_dir/fpc.cfg"
          paths=(
            usr/local/lib/fpc
            "${fpc_config_dir#/}"
            "${lazarus_dir#/}"
          )

          for candidate in \
            usr/local/bin/fpc \
            usr/local/bin/fpcmake \
            usr/local/bin/fpcmkcfg \
            usr/local/bin/fpcres \
            usr/local/bin/ppca64
          do
            if [ -e "/$candidate" ] || [ -L "/$candidate" ]; then
              paths+=("$candidate")
            fi
          done

          mkdir -p "$(dirname "$archive")"
          sudo tar --create --file "$archive" --directory / "${paths[@]}"
          sudo chown "$(id -u):$(id -g)" "$archive"

      - name: Configure toolchain paths
        shell: bash
        run: |
          set -euo pipefail
          lazarus_dir="$RUNNER_TOOL_CACHE/tlazserial/installed/lazarus-4.8"
          fpc_config_dir="$RUNNER_TOOL_CACHE/tlazserial/installed/fpc-config"
          test -f "$fpc_config_dir/fpc.cfg"
          lazbuild_path=''
          while IFS= read -r candidate; do
            lazbuild_path="$candidate"
            break
          done < <(find "$lazarus_dir" -type f -name lazbuild -print)
          test -n "$lazbuild_path"
          test -x "$lazbuild_path"
          lazarus_root="$(dirname "$lazbuild_path")"
          echo '/usr/local/bin' >> "$GITHUB_PATH"
          echo "$lazarus_root" >> "$GITHUB_PATH"
          echo "LAZARUS_DIR=$lazarus_root" >> "$GITHUB_ENV"
          echo "PPC_CONFIG_PATH=$fpc_config_dir" >> "$GITHUB_ENV"

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(lazbuild --lazarusdir="$LAZARUS_DIR" --version)" = '4.8'
          case "$(fpc -iV)" in
            3.2.4*) ;;
            *) echo 'Expected the official FPC 3.2.4rc1 macOS toolchain' >&2; exit 1 ;;
          esac

      - name: Save Lazarus toolchain cache
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.tool_cache }}/tlazserial/lazarus-4.8-macos-arm64.tar
          key: tlazserial-macos-latest-arm64-lazarus-4.8-fpc-3.2.4rc1-v2

      - name: Build package, tests and examples
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts

          lazbuild --lazarusdir="$LAZARUS_DIR" \
            --build-all --ws=cocoa LazSerialPort.lpk \
            2>&1 | tee ci-artifacts/build-package.log
          lazbuild --lazarusdir="$LAZARUS_DIR" --build-all --ws=cocoa \
            tests/deviceinfo/serialdeviceinfotests.lpi \
            2>&1 | tee ci-artifacts/build-deviceinfo-tests.log
          lazbuild --lazarusdir="$LAZARUS_DIR" --build-all --ws=cocoa \
            tests/selector/serialselectortests.lpi \
            2>&1 | tee ci-artifacts/build-selector-tests.log
          lazbuild --lazarusdir="$LAZARUS_DIR" --build-all --ws=cocoa \
            examples/serial-selector/serialselectorexample.lpi \
            2>&1 | tee ci-artifacts/build-serial-selector-example.log
          lazbuild --lazarusdir="$LAZARUS_DIR" --build-all --ws=cocoa \
            examples/serial-gps/serialgpsexample.lpi \
            2>&1 | tee ci-artifacts/build-serial-gps-example.log

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail

          tests/deviceinfo/.test_build/serialdeviceinfotests \
            --all --format=xml \
            --file=ci-artifacts/deviceinfo-results.xml \
            2>&1 | tee ci-artifacts/run-deviceinfo-tests.log
          tests/selector/.test_build/serialselectortests \
            --all --format=xml \
            --file=ci-artifacts/selector-results.xml \
            2>&1 | tee ci-artifacts/run-selector-tests.log

      - name: Validate test reports
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          echo '### FPCUnit results' >> "$GITHUB_STEP_SUMMARY"
          echo '| Project | Tests | Errors | Failures |' >> "$GITHUB_STEP_SUMMARY"
          echo '| --- | ---: | ---: | ---: |' >> "$GITHUB_STEP_SUMMARY"

          validate_report() {
            report="$1"
            project="$2"
            test -s "$report"
            tests="$(sed -n 's:.*<NumberOfRunTests>\([0-9][0-9]*\)</NumberOfRunTests>.*:\1:p' "$report" | tail -n 1)"
            errors="$(sed -n 's:.*<NumberOfErrors>\([0-9][0-9]*\)</NumberOfErrors>.*:\1:p' "$report" | tail -n 1)"
            failures="$(sed -n 's:.*<NumberOfFailures>\([0-9][0-9]*\)</NumberOfFailures>.*:\1:p' "$report" | tail -n 1)"
            test -n "$tests"
            test -n "$errors"
            test -n "$failures"
            printf '| %s | %s | %s | %s |\n' \
              "$project" "$tests" "$errors" "$failures" \
              >> "$GITHUB_STEP_SUMMARY"
            test "$tests" -gt 0
            test "$errors" -eq 0
            test "$failures" -eq 0
          }

          validate_report ci-artifacts/deviceinfo-results.xml deviceinfo
          validate_report ci-artifacts/selector-results.xml selector

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tlazserial-macos-test-reports
          path: ci-artifacts/*-results.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: tlazserial-macos-diagnostics
          path: |
            ci-artifacts/
            tests/deviceinfo/.test_build/
            tests/selector/.test_build/
          if-no-files-found: warn
          retention-days: 14
